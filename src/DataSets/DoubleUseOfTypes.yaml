openapi: "3.1.0"
info:
  version: 1.0.0
  title: Swagger Petstore
  license:
    name: MIT
servers:
  - url: http://api.example.com/v1/
paths:
  /:
    get:
      summary: Root
      operationId: root
      tags:
        - root
      responses:
        200:
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                - $ref: "#/components/schemas/issueFieldValue"
components:
  schemas:
    issueFieldValue:
      type: object
      required:
        - value
      properties:
        value:
          type:
            - "null"
            - string
            - number
            - integer
          anyOf:
            - type: string
            - type: number
            - type: integer
