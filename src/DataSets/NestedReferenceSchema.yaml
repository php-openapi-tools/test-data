openapi: "3.1.0"
info:
  version: 1.0.0
  title: Swagger Petstore
  license:
    name: MIT
servers:
  - url: http://api.example.com/v1/
paths:
  /:
    get:
      summary: Root
      operationId: root
      tags:
        - root
      responses:
        200:
          description: A paged array of pets
          headers:
            x-next:
              description: A link to the next page of responses
              schema:
                type: string
          content:
            application/json:
              schema:
                - $ref: "#/components/schemas/basic"
components:
  schemas:
    string:
      type: object
      required:
        - string
      properties:
        string:
          type: string
    basic:
      type: object
      required:
        - id
        - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: object
          required:
            - preferred
          properties:
            preferred:
              "$ref": "#/components/schemas/string"
            first:
              "$ref": "#/components/schemas/string"
            middle:
              "$ref": "#/components/schemas/string"
            last:
              "$ref": "#/components/schemas/string"
